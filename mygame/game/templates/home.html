{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Beastilia（仮）</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
</head>
<body>
    <div class="header">
        <div class="logo">Beastilia（仮）</div>
        <div>― １日１回の巡りゆく冒険 ―</div>

        {% if user.is_authenticated %}
            <div style="margin-top:10px;font-size:14px;">
                ログイン中ユーザ: {{ user.userprofile.account_id }} /
                <a href="/logout/" style="color:#ccc;">ログアウト</a>
            </div>
        {% else %}
            <div style="margin-top:10px;font-size:14px;">
                ログインしていません
            </div>
        {% endif %}
    </div>

    <div class="menu">
        <a href="/register/">新規登録</a>
        <a href="/login/">ログイン</a>
        <a href="/terms/">利用規約</a>
        <a href="/news/">お知らせ</a>
        <a href="/news/">更新履歴</a>
    </div>

    <div class="footer">
        &copy; 2025 Beastilia Project
    </div>
</body>
</html>
