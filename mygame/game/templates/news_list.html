<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>お知らせ一覧</title>
</head>
<style>
body {
    background: #1e1e1e;
    color: #eee;
    font-family: sans-serif;
    margin: 0;
    text-align: center;
}
.header {
    padding: 40px 0;
}
.logo {
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 20px;
}
.menu {
    margin-top: 30px;
}
.menu a {
    display: block;
    margin: 10px auto;
    padding: 10px 20px;
    width: 200px;
    background: #333;
    color: #fff;
    text-decoration: none;
    border-radius: 4px;
}
.menu a:hover {
    background: #555;
}
.footer {
    margin-top: 40px;
    font-size: 12px;
    color: #aaa;
}
</style>
<body>
  <h1>お知らせ</h1>

  <ul>
    {% for a in articles %}
      <li>
        <div>{{ a.date }}</div>
        <div>
          <a href="{% url 'news_detail' a.slug %}">{{ a.title }}</a>
        </div>
        <div>{{ a.summary }}</div>
      </li>
    {% endfor %}
  </ul>
</body>
</html>
