{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ビースティリア（仮）チュートリアル</title>
<style>
body {
    background: #1e1e1e;
    color: #eee;
    font-family: sans-serif;
    margin: 0;
}
.container {
    max-width: 400px;
    margin: 60px auto;
    background: #2b2b2b;
    padding: 20px 30px;
    border-radius: 4px;
}
h1 {
    text-align: center;
    margin-top: 0;
}
label {
    display: block;
    margin-top: 15px;
}
input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 3px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #eee;
}
button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #4a4a4a;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #666;
}
.errorlist {
    color: #ff8080;
    list-style: none;
    padding-left: 0;
    margin: 5px 0 0;
    font-size: 13px;
}
.race-icon {
  width: 72px;
  height: 72px;
}

.race-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.race-option {
  text-align: center;
  cursor: pointer;
  background: #222;
  padding: 8px;
  border-radius: 6px;
}
</style>
</head>
<body>

<script>
  // Django側で決めた言語コードを埋め込む例（"ja" / "en" など）
  const LANG = "{{ language_code|default:'ja' }}";
</script>
<script src="{% static 'game/onboarding_script.js' %}"></script>

<div class="container">

    <h1 id="title"></h1>

    <p id="description" style="font-size:14px;color:#ccc;"></p>

    <form method="post">

        <div class="race-list">
        {% for icon in icons %}
            <div class="race-option">
            <img src="{% static 'game/icons/races/' %}{{ icon }}" class="race-icon">
            </div>
        {% endfor %}
        </div>

        {% csrf_token %}
        {{ form.non_field_errors }}

        <label>
            <span id="label_name"></span>
            {{ form.name }}
            {{ form.name.errors }}
        </label>

        <button id="button_create" type="submit"></button>
    </form>

</div>
</body>
</html>
