#メインの画面です
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ビースティリア（仮）チュートリアル</title>
<style>
body {
    background: #1e1e1e;
    color: #eee;
    font-family: sans-serif;
    margin: 0;
}
.container {
    max-width: 400px;
    margin: 60px auto;
    background: #2b2b2b;
    padding: 20px 30px;
    border-radius: 4px;
}
h1 {
    text-align: center;
    margin-top: 0;
}
label {
    display: block;
    margin-top: 15px;
}
input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border-radius: 3px;
    border: 1px solid #555;
    background: #1a1a1a;
    color: #eee;
}
button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    background: #4a4a4a;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}
button:hover {
    background: #666;
}
.errorlist {
    color: #ff8080;
    list-style: none;
    padding-left: 0;
    margin: 5px 0 0;
    font-size: 13px;
}
</style>
</head>
<body>
<div class="header">
    <div class="header-left">
        Beastilia（仮） メインメニュー
        <div class="char-info-line">
            {% if selected %}
                操作中キャラ：
                <strong>{{ selected.name }}</strong>
                （ランク: {{ selected.rank }} / ロケーションID: {{ selected.location.name }}）
            {% else %}
                操作中キャラ：ここにはだれもいない
            {% endif %}
        </div>
    </div>
    <div class="header-right">
        ログイン中：{{ request.user.userprofile.account_id }}<br>
        <a href="/logout/" style="color:#ccc;">ログアウト</a>
    </div>
</div>

<div class="container">

    <p style="font-size:14px;color:#ccc;">
        メイン画面だぜい！。<br>
    </p>

</div>
</body>
</html>
